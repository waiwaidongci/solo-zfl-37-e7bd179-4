<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>墨锭试磨室 · 排程与双人复核</title>
<style>
  :root{
    --bg:#eef1ea; --panel:#fff; --ink:#20261f; --muted:#6a7265; --line:#d3dccb;
    --accent:#4d6b3f; --accent-dark:#3d5532; --warn:#a3452f; --amber:#9a6b14; --ok:#3d7a4f;
    --draft:#8a9084; --pending:#8a6a1c; --approved:#3d7a4f; --rejected:#a3452f;
    --running:#2f6a8f; --review:#8a4d8a; --completed:#5f6b58; --cancelled:#8a9084;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:14px}
  header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;white-space:nowrap}
  header .sub{color:var(--muted);font-size:12px}
  .spacer{flex:1}
  select,input,textarea{border:1px solid var(--line);border-radius:7px;padding:8px 9px;font:inherit;background:#fff;color:var(--ink)}
  button{border:0;border-radius:7px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
  button:hover{background:var(--accent-dark)}
  button.ghost{background:#eef1ea;color:var(--ink);border:1px solid var(--line)}
  button.danger{background:var(--warn)}
  button.tiny{padding:5px 9px;font-size:12px;border-radius:6px}
  button:disabled{opacity:.45;cursor:not-allowed}
  .chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;white-space:nowrap}
  .chip b{font-size:15px}
  .chip.bad{border-color:var(--warn);color:var(--warn);animation:pulse 1.6s infinite}
  .chip.warn{border-color:var(--amber);color:var(--amber)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px 4px}
  .board{display:flex;gap:12px;padding:12px 18px 26px;overflow-x:auto;align-items:flex-start}
  .column{flex:1 0 238px;min-width:238px;background:rgba(255,255,255,.65);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 150px)}
  .column h3{margin:0;padding:10px 12px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
  .column h3 .n{background:#fff;border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px}
  .cards{padding:9px;display:flex;flex-direction:column;gap:9px;overflow-y:auto}
  .card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px;display:flex;flex-direction:column;gap:6px;cursor:pointer;border-left-width:4px}
  .card:hover{box-shadow:0 2px 10px rgba(40,60,30,.10)}
  .card .title{font-weight:700}
  .card .meta{color:var(--muted);font-size:12px;line-height:1.55}
  .badge{display:inline-block;font-size:11px;border-radius:999px;padding:2px 8px;color:#fff;width:fit-content}
  .badge.draft{background:var(--draft)} .badge.pending{background:var(--pending)} .badge.approved{background:var(--approved)}
  .badge.rejected{background:var(--rejected)} .badge.running{background:var(--running)}
  .badge.cancel_review{background:var(--review)} .badge.completed{background:var(--completed)} .badge.cancelled{background:var(--cancelled)}
  .flag{font-size:11.5px;font-weight:700;border-radius:5px;padding:2px 7px}
  .flag.conflict{background:#fae6e0;color:var(--warn)}
  .flag.overdue{background:#f7ecd4;color:var(--amber)}
  .card .actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
  .empty{color:var(--muted);font-size:12px;text-align:center;padding:14px 4px}
  /* 弹层 */
  .overlay{position:fixed;inset:0;background:rgba(25,32,22,.45);z-index:40;display:none;align-items:flex-start;justify-content:center;padding:26px 14px;overflow-y:auto}
  .overlay.open{display:flex}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:560px;padding:20px;display:flex;flex-direction:column;gap:4px}
  .modal.wide{max-width:720px}
  .modal h2{margin:0 0 8px;font-size:17px}
  .modal label{display:block;margin:9px 0 4px;color:var(--muted);font-size:12.5px}
  .modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
  .preview{margin-top:10px;border-radius:8px;padding:9px 11px;font-size:12.5px;display:none}
  .preview.show{display:block}
  .preview.ok{background:#e8f2ea;color:var(--ok)}
  .preview.bad{background:#fae6e0;color:var(--warn)}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2a3127;color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;z-index:60;opacity:0;transition:opacity .25s;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  .toast.err{background:var(--warn)}
  /* 审计抽屉 */
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:#fff;z-index:50;transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column;box-shadow:-6px 0 24px rgba(0,0,0,.15)}
  .drawer.open{transform:none}
  .drawer header{position:static}
  .drawer .body{flex:1;overflow-y:auto;padding:14px 18px}
  .event{border-left:3px solid var(--line);padding:4px 0 14px 14px;position:relative}
  .event::before{content:"";position:absolute;left:-5px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .event .ev-title{font-weight:700;font-size:13px}
  .event .ev-meta{color:var(--muted);font-size:11.5px;margin:2px 0}
  .event pre{background:#f4f6f1;border-radius:6px;padding:7px 9px;font-size:11px;overflow-x:auto;margin:5px 0 0;white-space:pre-wrap;word-break:break-all}
  .chain{font-size:12px;border-radius:8px;padding:9px 12px;margin:10px 18px}
  .chain.ok{background:#e8f2ea;color:var(--ok)}
  .chain.bad{background:#fae6e0;color:var(--warn)}
  @media (max-width:760px){
    header{padding:9px 12px}
    header h1{font-size:16px}
    .chips{padding:10px 12px 2px}
    .board{flex-direction:column;overflow:visible;padding:10px 12px 30px}
    .column{flex:none;min-width:0;max-height:none}
    .cards{overflow:visible}
    .overlay{padding:0}
    .modal{border-radius:14px 14px 0 0;min-height:100%;max-width:100%;padding:18px 16px 30px}
    .modal .row{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>墨锭试磨室 · 排程看板</h1>
    <div class="sub">草稿 → 提交 → 审核 → 执行 → 完成 / 取消（开始后取消需双人复核）</div>
  </div>
  <div class="spacer"></div>
  <label style="margin:0;color:var(--muted);font-size:12px">当前身份</label>
  <select id="actor" style="min-width:170px"></select>
  <button class="ghost tiny" id="refreshBtn">刷新</button>
  <button id="newPlanBtn">+ 新建排期</button>
</header>

<div class="chips" id="chips"></div>

<main class="board" id="board"></main>

<!-- 新建 / 编辑排期 -->
<div class="overlay" id="planOverlay">
  <form class="modal" id="planForm">
    <h2 id="planModalTitle">新建排期</h2>
    <div class="row">
      <div>
        <label>墨锭 *</label>
        <div style="display:flex;gap:6px">
          <select name="itemCode" id="fItem" required style="flex:1"></select>
          <button type="button" class="ghost tiny" id="newItemBtn" title="新建墨锭">+</button>
        </div>
      </div>
      <div><label>台位 *</label><select name="stationId" id="fStation" required></select></div>
    </div>
    <div class="row">
      <div><label>操作人 *</label><select name="operatorId" id="fOperator" required></select></div>
      <div><label>复核人 *（不可与操作人相同）</label><select name="reviewerId" id="fReviewer" required></select></div>
    </div>
    <div class="row">
      <div><label>开始时间 *</label><input type="datetime-local" step="60" name="start" id="fStart" required></div>
      <div><label>结束时间 *</label><input type="datetime-local" step="60" name="end" id="fEnd" required></div>
    </div>
    <h2 style="margin:12px 0 2px;font-size:14px">配方参数</h2>
    <div class="row">
      <div><label>试磨纸张</label><input name="paper" placeholder="净皮宣纸"></div>
      <div><label>施压力度</label>
        <select name="pressure"><option>轻力</option><option selected>中力</option><option>重力</option></select>
      </div>
    </div>
    <div class="row">
      <div><label>加水量（滴）</label><input name="waterDrops" type="number" min="0" value="20"></div>
      <div><label>研磨分钟</label><input name="grindMinutes" type="number" min="0" value="30"></div>
    </div>
    <div class="row">
      <div><label>目标评分</label><input name="targetScore" type="number" min="0" max="100" value="85"></div>
      <div></div>
    </div>
    <label>备注</label><textarea name="note" placeholder="醒墨、观察重点等"></textarea>
    <div class="preview" id="conflictPreview"></div>
    <div class="foot">
      <button type="button" class="ghost" id="planCancel">取消</button>
      <button type="button" class="ghost" id="saveDraftBtn">存草稿</button>
      <button type="button" id="submitBtn">提交审核</button>
    </div>
  </form>
</div>

<!-- 通用原因弹窗（驳回 / 取消 / 完成） -->
<div class="overlay" id="reasonOverlay">
  <form class="modal" id="reasonForm">
    <h2 id="reasonTitle">请填写</h2>
    <div id="reasonBody"></div>
    <label id="reasonLabel" style="margin-top:12px">原因 *</label>
    <textarea id="reasonText" required></textarea>
    <div class="foot">
      <button type="button" class="ghost" id="reasonCancel">取消</button>
      <button type="button" class="danger" id="reasonOk">确认</button>
    </div>
  </form>
</div>

<!-- 审计抽屉 -->
<div class="drawer" id="drawer">
  <header>
    <h1 style="font-size:16px" id="drawerTitle">审计链</h1>
    <div class="spacer"></div>
    <button class="ghost tiny" id="drawerClose">关闭</button>
  </header>
  <div class="chain" id="chainBox"></div>
  <div class="body" id="drawerBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const STATUS_ORDER = ["draft","pending","approved","rejected","running","cancel_review","completed","cancelled"];
const LABELS = {draft:"草稿",pending:"待审核",approved:"已批准",rejected:"已驳回",running:"执行中",cancel_review:"待取消复核",completed:"已完成",cancelled:"已取消"};
const ACTION_LABELS = {
  plan_created:"创建排期", plan_edited:"修改草稿", plan_deleted:"删除草稿",
  plan_submitted:"提交审核", review_approved:"审核通过", review_rejected:"审核驳回",
  plan_started:"开始执行", plan_completed:"完成", cancel_requested:"申请取消",
  cancel_confirmed:"取消已确认", cancel_rejected:"取消复核驳回（继续执行）", item_created:"墨锭建档",
};

let state = null;
let editingId = null;
let reasonCallback = null;

const $ = (sel) => document.querySelector(sel);
const actorSel = $("#actor");

function getActor(){ return actorSel.value; }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function api(path, opts = {}){
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type":"application/json", "X-User-Id": getActor(), ...(opts.headers||{}) },
  });
  const data = await res.json().catch(() => ({}));
  if(!res.ok){
    const err = new Error(ERRORS[data.error] || data.error || "请求失败");
    err.code = data.error; err.conflicts = data.conflicts;
    throw err;
  }
  return data;
}

const ERRORS = {
  unauthorized:"请先选择操作身份", forbidden:"无权执行该操作", reviewer_is_operator:"审核人不能是操作人本人",
  reviewer_is_requester:"取消复核人不能是申请人本人（需双人复核）", reason_required:"必须填写原因",
  conflict:"排期冲突：墨锭或台位时段重叠", bad_item:"请选择有效墨锭", bad_station:"请选择台位",
  bad_operator:"请选择操作人", bad_reviewer:"请选择复核人", bad_time:"时间格式不正确",
  end_before_start:"结束时间必须晚于开始时间", reviewer_required:"请先指定复核人再提交",
  not_editable:"仅草稿/被驳回的排期可编辑", not_submittable:"当前状态不能提交",
  not_pending:"该排期不在待审核状态", not_approved:"仅已批准排期可开始执行",
  not_running:"仅执行中的排期可完成", not_cancellable:"当前状态不可取消",
  not_in_cancel_review:"该排期不在取消复核中", only_draft_deletable:"只有草稿可以删除",
  plan_not_found:"排期不存在", item_exists:"墨锭编号已存在", code_required:"墨锭编号必填",
  bad_decision:"无效的决定", bad_json:"请求内容不是合法 JSON",
};

async function load(){
  state = await api("/api/bootstrap");
  renderAll();
}

/* ---------------- 渲染 ---------------- */

function overlap(aS,aE,bS,bE){ return aS < bE && aE > bS; }
function planConflicts(plan){
  const out = [];
  if(!["pending","approved","running","cancel_review"].includes(plan.status)) return out;
  for(const other of state.plans){
    if(other.id === plan.id || !["pending","approved","running","cancel_review"].includes(other.status)) continue;
    if(overlap(Date.parse(plan.start),Date.parse(plan.end),Date.parse(other.start),Date.parse(other.end)) &&
       (plan.itemCode === other.itemCode || plan.stationId === other.stationId)){
      out.push(other);
    }
  }
  return out;
}

function renderAll(){
  renderChips();
  renderBoard();
}

function renderChips(){
  const s = state.stats;
  const chips = [
    `<span class="chip">排期总数 <b>${state.plans.length}</b></span>`,
    `<span class="chip ${s.activeConflicts ? "bad" : ""}">当前冲突 <b>${s.activeConflicts}</b></span>`,
    `<span class="chip ${s.conflictRejects ? "warn" : ""}">并发拦截 <b>${s.conflictRejects}</b></span>`,
    `<span class="chip ${s.overdueCount ? "warn" : ""}">逾期 <b>${s.overdueCount}</b></span>`,
    `<span class="chip">待审核 <b>${s.statusCounts.pending}</b></span>`,
    `<span class="chip">执行中 <b>${s.statusCounts.running + s.statusCounts.cancel_review}</b></span>`,
    `<span class="chip ${state.chainValid ? "" : "bad"}">审计链 <b>${state.chainValid ? "完整" : "异常"}</b></span>`,
  ];
  $("#chips").innerHTML = chips.join("");
}

function fmtTime(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  const p = n => String(n).padStart(2,"0");
  return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function renderBoard(){
  const now = Date.parse(state.serverTime);
  $("#board").innerHTML = STATUS_ORDER.map(st => {
    const list = state.plans.filter(p => p.status === st);
    return `<section class="column">
      <h3>${LABELS[st]} <span class="n">${list.length}</span></h3>
      <div class="cards">
        ${list.length ? list.map(p => cardHtml(p, now)).join("") : '<div class="empty">—</div>'}
      </div>
    </section>`;
  }).join("");
  document.querySelectorAll(".card").forEach(el => {
    el.querySelector(".card-body")?.addEventListener("click", () => openAudit(el.dataset.id));
    el.querySelectorAll("[data-act]").forEach(btn => btn.addEventListener("click", e => {
      e.stopPropagation();
      onAction(btn.dataset.act, btn.dataset.id);
    }));
  });
}

function cardHtml(p, now){
  const me = getActor();
  const admin = state.users.find(u => u.id === me)?.role === "管理员";
  const isOperator = p.operatorId === me;
  const isReviewer = p.reviewerId === me;
  const isCancelRequester = p.cancelRequestedBy === me;
  const btns = [];
  if(p.status === "draft" && (isOperator||admin)){
    btns.push(["edit","编辑","ghost"],["submit","提交",""],["del","删除","ghost"]);
  }
  if(p.status === "rejected" && (isOperator||admin)){
    btns.push(["edit","改后重提",""],["audit","驳回原因","ghost"]);
  }
  if(p.status === "pending" && (isReviewer||admin) && !isOperator){
    btns.push(["approve","通过",""],["reject","驳回","danger"]);
  }
  if(p.status === "approved" && (isOperator||admin)){
    btns.push(["start","开始执行",""],["cancel","申请取消","danger"]);
  }
  if(p.status === "running" && (isOperator||admin)){
    btns.push(["complete","完成",""],["cancel","申请取消","danger"]);
  }
  if(p.status === "cancel_review"){
    if(!isCancelRequester && (isReviewer||admin) && p.cancelRequestedBy !== me){
      btns.push(["cancel-confirm","确认取消","danger"],["cancel-reject","驳回取消","ghost"]);
    }
    btns.push(["audit","查看原因","ghost"]);
  }
  btns.push(["audit","审计","ghost"]);

  const cf = planConflicts(p);
  const overdue = ["pending","approved","running","cancel_review"].includes(p.status) && Date.parse(p.end) < now;
  const flags = [
    cf.length ? `<span class="flag conflict">冲突 ×${cf.length}</span>` : "",
    overdue ? `<span class="flag overdue">${p.status === "running" || p.status === "cancel_review" ? "执行逾期" : "逾期未开始"}</span>` : "",
  ].join(" ");

  return `<article class="card" data-id="${p.id}" style="border-left-color:var(--${p.status})">
    <div class="card-body">
      <div class="title">${esc(p.itemCode)} · ${esc(p.item?.smokeSource||"")}</div>
      <span class="badge ${p.status}">${LABELS[p.status]}</span> ${flags}
      <div class="meta">
        ${esc(p.station?.name||p.stationId)} · ${fmtTime(p.start)}–${fmtTime(p.end)}<br>
        操作 ${esc(p.operator?.name||"")} ／ 复核 ${esc(p.reviewer?.name||"")}<br>
        ${esc(p.params.paper||"")} · ${p.params.waterDrops} 滴 · ${p.params.grindMinutes} 分钟
        ${p.reason ? `<br><b style="color:var(--warn)">驳回原因：</b>${esc(p.reason)}` : ""}
        ${p.cancelReason ? `<br><b style="color:var(--review)">取消原因：</b>${esc(p.cancelReason)}` : ""}
      </div>
    </div>
    <div class="actions">
      ${btns.map(([act,label,cls]) => `<button class="tiny ${cls}" data-act="${act}" data-id="${p.id}">${label}</button>`).join("")}
    </div>
  </article>`;
}

/* ---------------- 动作 ---------------- */

async function onAction(act, id){
  try{
    if(act === "edit") return openPlan(id);
    if(act === "audit") return openAudit(id);
    if(act === "del"){
      if(!confirm("删除该草稿？此操作仍会写入审计链。")) return;
      await api(`/api/plans/${encodeURIComponent(id)}`, { method:"DELETE" });
      return reloadOk("草稿已删除");
    }
    if(act === "submit"){
      const r = await api(`/api/plans/${encodeURIComponent(id)}/submit`, { method:"POST", body:"{}" });
      return reloadOk("已提交审核");
    }
    if(act === "approve"){
      await api(`/api/plans/${encodeURIComponent(id)}/review`, { method:"POST", body:JSON.stringify({ decision:"approved" }) });
      return reloadOk("已审核通过");
    }
    if(act === "reject"){
      const reason = await askReason("驳回排期", "请写明驳回原因（必填），将退回操作人修改。", "驳回原因");
      await api(`/api/plans/${encodeURIComponent(id)}/review`, { method:"POST", body:JSON.stringify({ decision:"rejected", reason }) });
      return reloadOk("已驳回并释放预占");
    }
    if(act === "start"){
      await api(`/api/plans/${encodeURIComponent(id)}/start`, { method:"POST", body:"{}" });
      return reloadOk("已开始执行");
    }
    if(act === "complete"){
      const result = await askReason("完成试磨", "记录试磨结果（出墨、墨色、评分等）。", "试磨结果", false);
      await api(`/api/plans/${encodeURIComponent(id)}/complete`, { method:"POST", body:JSON.stringify({ result }) });
      return reloadOk("已完成并释放台位");
    }
    if(act === "cancel"){
      const plan = state.plans.find(p => p.id === id);
      const running = plan.status === "running";
      const reason = await askReason(running ? "申请取消（需双人复核）" : "取消排期",
        running ? "执行开始后的取消必须由另一位复核人确认。" : "未开始的排期登记原因后立即取消并释放占用。", "取消原因");
      await api(`/api/plans/${encodeURIComponent(id)}/cancel-request`, { method:"POST", body:JSON.stringify({ reason }) });
      return reloadOk(running ? "已提交，等待第二人复核" : "已取消并释放占用");
    }
    if(act === "cancel-confirm"){
      await api(`/api/plans/${encodeURIComponent(id)}/cancel-review`, { method:"POST", body:JSON.stringify({ decision:"confirmed" }) });
      return reloadOk("取消已确认");
    }
    if(act === "cancel-reject"){
      const reason = await askReason("驳回取消申请", "驳回后排期继续执行，请说明原因。", "驳回原因");
      await api(`/api/plans/${encodeURIComponent(id)}/cancel-review`, { method:"POST", body:JSON.stringify({ decision:"rejected", reason }) });
      return reloadOk("已驳回取消，继续执行");
    }
  }catch(err){
    toast(err.message + (err.conflicts ? conflictText(err.conflicts) : ""), true);
  }
}

function conflictText(list){
  return "（冲突：" + list.map(c => `${c.planId} ${c.reason === "item_busy" ? "墨锭被占用" : "台位被占用"} ${fmtTime(c.start)}`).join("；") + "）";
}

function reloadOk(msg){ return load().then(() => toast(msg)); }

/* ---------------- 原因弹窗 ---------------- */

function askReason(title, body, label, required = true){
  return new Promise((resolve, reject) => {
    $("#reasonTitle").textContent = title;
    $("#reasonBody").textContent = body;
    $("#reasonLabel").textContent = label + (required ? " *" : "");
    $("#reasonText").value = "";
    $("#reasonOverlay").classList.add("open");
    $("#reasonText").focus();
    reasonCallback = (ok) => {
      const v = $("#reasonText").value.trim();
      if(ok && required && !v){ toast("必须填写原因", true); return; }
      $("#reasonOverlay").classList.remove("open");
      ok ? resolve(v) : reject(new Error("cancel"));
    };
  });
}
$("#reasonOk").onclick = () => reasonCallback?.(true);
$("#reasonCancel").onclick = () => reasonCallback?.(false);
$("#reasonForm").onsubmit = e => { e.preventDefault(); reasonCallback?.(true); };

/* ---------------- 排期表单 ---------------- */

function toLocalInput(iso){
  if(!iso) return "";
  const d = new Date(iso), p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}

function fillBaseSelectors(selected){
  actorSel.innerHTML = state.users.map(u => `<option value="${u.id}" ${u.id===selected?"selected":""}>${esc(u.name)} · ${esc(u.role)}</option>`).join("");
}
function fillFormSelects(){
  $("#fItem").innerHTML = state.items.map(i => `<option value="${i.code}">${i.code} · ${esc(i.smokeSource)}</option>`).join("");
  $("#fStation").innerHTML = state.stations.map(s => `<option value="${s.id}">${s.id} · ${esc(s.name)}</option>`).join("");
  const users = state.users;
  const opOpts = (v) => users.map(u => `<option value="${u.id}" ${u.id===v?"selected":""}>${esc(u.name)} · ${esc(u.role)}</option>`).join("");
  $("#fOperator").innerHTML = opOpts(getActor());
  // 复核人默认选一位与操作人不同的复核师
  const other = users.find(u => u.id !== $("#fOperator").value) || users[0];
  $("#fReviewer").innerHTML = opOpts(other.id);
}

function openPlan(id){
  editingId = id || null;
  $("#planModalTitle").textContent = id ? "编辑排期（草稿 / 被驳回）" : "新建排期";
  fillFormSelects();
  const form = $("#planForm");
  if(id){
    const p = state.plans.find(x => x.id === id);
    form.itemCode.value = p.itemCode;
    form.stationId.value = p.stationId;
    form.operatorId.value = p.operatorId;
    form.reviewerId.value = p.reviewerId;
    form.start.value = toLocalInput(p.start);
    form.end.value = toLocalInput(p.end);
    form.paper.value = p.params.paper || "";
    form.pressure.value = p.params.pressure || "中力";
    form.waterDrops.value = p.params.waterDrops ?? 0;
    form.grindMinutes.value = p.params.grindMinutes ?? 0;
    form.targetScore.value = p.params.targetScore ?? 0;
    form.note.value = p.params.note || "";
  }else{
    form.reset();
    form.pressure.value = "中力";
    form.waterDrops.value = 20; form.grindMinutes.value = 30; form.targetScore.value = 85;
    form.operatorId.value = getActor();
    const other = state.users.find(u => u.id !== getActor());
    if(other) form.reviewerId.value = other.id;
  }
  $("#planOverlay").classList.add("open");
  refreshPreview();
}
function closePlan(){ $("#planOverlay").classList.remove("open"); editingId = null; }
$("#newPlanBtn").onclick = () => openPlan(null);
$("#planCancel").onclick = closePlan;
$("#newItemBtn").onclick = async () => {
  const code = prompt("新墨锭编号（如 IS-004）");
  if(!code) return;
  try{
    const smoke = prompt("烟料来源（可空）") || "";
    await api("/api/items", { method:"POST", body:JSON.stringify({ code, smokeSource: smoke }) });
    await load();
    fillFormSelects();
    $("#planForm").itemCode.value = code;
    toast("墨锭已建档");
  }catch(e){ toast(e.message, true); }
};

function formPayload(){
  const f = $("#planForm");
  return {
    itemCode: f.itemCode.value, stationId: f.stationId.value,
    operatorId: f.operatorId.value, reviewerId: f.reviewerId.value,
    start: f.start.value ? new Date(f.start.value).toISOString() : "",
    end: f.end.value ? new Date(f.end.value).toISOString() : "",
    params: {
      paper: f.paper.value.trim(), pressure: f.pressure.value,
      waterDrops: Number(f.waterDrops.value)||0, grindMinutes: Number(f.grindMinutes.value)||0,
      targetScore: Number(f.targetScore.value)||0, note: f.note.value.trim(),
    },
  };
}

function refreshPreview(){
  const box = $("#conflictPreview");
  const f = $("#planForm");
  if(!f.start.value || !f.end.value || !f.itemCode.value || !f.stationId.value){ box.classList.remove("show"); return; }
  const p = formPayload();
  if(Date.parse(p.end) <= Date.parse(p.start)){
    box.className = "preview show bad"; box.textContent = "结束时间必须晚于开始时间"; return;
  }
  if(p.operatorId && p.reviewerId && p.operatorId === p.reviewerId){
    box.className = "preview show bad"; box.textContent = "复核人不能与操作人为同一人"; return;
  }
  const hits = state.plans.filter(o =>
    o.id !== editingId && ["pending","approved","running","cancel_review"].includes(o.status) &&
    overlap(Date.parse(p.start),Date.parse(p.end),Date.parse(o.start),Date.parse(o.end)) &&
    (p.itemCode === o.itemCode || p.stationId === o.stationId));
  if(hits.length){
    box.className = "preview show bad";
    box.innerHTML = "预计冲突：" + hits.map(o => `${o.id}（${o.itemCode===p.itemCode?"墨锭并行":"台位重叠"} ${fmtTime(o.start)}–${fmtTime(o.end)}）`).join("；");
  }else{
    box.className = "preview show ok"; box.textContent = "时段空闲，可提交。";
  }
}
["fStart","fEnd","fItem","fStation","fOperator","fReviewer"].forEach(id => {
  $("#"+id).addEventListener("change", refreshPreview);
  $("#"+id).addEventListener("change", () => { if(id==="fOperator"){ const other=state.users.find(u=>u.id!==$("#fOperator").value); if(other)$("#fReviewer").value=other.id;} refreshPreview(); });
});

async function savePlan(submit){
  const payload = formPayload();
  if(!payload.start || !payload.end) return toast("请填写开始与结束时间", true);
  if(Date.parse(payload.end) <= Date.parse(payload.start)) return toast("结束时间必须晚于开始时间", true);
  if(submit && payload.operatorId === payload.reviewerId) return toast("复核人不能是操作人本人", true);
  try{
    let r;
    if(editingId){
      r = await api(`/api/plans/${encodeURIComponent(editingId)}`, { method:"PATCH", body:JSON.stringify(payload) });
      if(submit) await api(`/api/plans/${encodeURIComponent(editingId)}/submit`, { method:"POST", body:"{}" });
    }else{
      r = await api("/api/plans", { method:"POST", body:JSON.stringify({ ...payload, submit }) });
    }
    closePlan();
    await load();
    toast(submit ? "已提交审核（占用已预占）" : "草稿已保存");
  }catch(err){
    toast(err.message + (err.conflicts ? conflictText(err.conflicts) : ""), true);
  }
}
$("#saveDraftBtn").onclick = () => savePlan(false);
$("#submitBtn").onclick = () => savePlan(true);

/* ---------------- 审计抽屉 ---------------- */

async function openAudit(id){
  $("#drawerTitle").textContent = id ? `审计链 · ${id}` : "全局审计链";
  try{
    const { events, chainValid } = await api(id ? `/api/events?planId=${encodeURIComponent(id)}` : "/api/events");
    $("#chainBox").className = "chain " + (chainValid ? "ok" : "bad");
    $("#chainBox").textContent = chainValid
      ? `✓ 哈希链校验通过（${events.length} 条记录，仅追加不可改）`
      : "✗ 哈希链校验失败：审计记录可能被篡改！";
    $("#drawerBody").innerHTML = events.slice().reverse().map(ev => {
      const actor = state.users.find(u => u.id === ev.actorId);
      return `<div class="event">
        <div class="ev-title">#${ev.seq} ${ACTION_LABELS[ev.action] || ev.action}</div>
        <div class="ev-meta">${new Date(ev.ts).toLocaleString("zh-CN")} · ${esc(actor?.name || ev.actorId)}${ev.planId ? " · " + ev.planId : ""}</div>
        <pre>${esc(JSON.stringify(ev.detail, null, 2))}</pre>
        <pre title="哈希">hash ${esc(ev.hash.slice(0,20))}…</pre>
      </div>`;
    }).join("") || '<div class="empty">暂无记录</div>';
    $("#drawer").classList.add("open");
  }catch(e){ toast(e.message, true); }
}
$("#drawerClose").onclick = () => $("#drawer").classList.remove("open");

/* ---------------- toast / 轮询 ---------------- */

let toastTimer;
function toast(msg, err = false){
  const t = $("#toast");
  t.textContent = msg;
  t.className = "toast show" + (err ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3600);
}

$("#refreshBtn").onclick = () => load().then(() => toast("已刷新"));
actorSel.addEventListener("change", () => {
  localStorage.setItem("inkActor", actorSel.value);
  renderBoard();
});
setInterval(load, 4000); // 看板自动刷新，冲突/逾期实时可见

(async function init(){
  // 先用一次请求拿到 users 再填充身份
  state = await fetch("/api/bootstrap").then(r => r.json());
  fillBaseSelectors(localStorage.getItem("inkActor") || state.users[0].id);
  renderAll();
})();
</script>
